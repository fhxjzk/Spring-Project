
<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>알림 화면 테스트</title>

<!-- 알림 전용 CSS -->
<link rel="stylesheet" href="../css/notification.css">

<style>
body {
	padding: 30px;
	font-family: Arial, sans-serif;
}

.header-actions {
	display: flex;
	justify-content: flex-end;
	position: relative;
}

#notificationBell {
	cursor: pointer;
}
</style>
</head>

<body>

	<h2>알림 기능 테스트</h2>

	<div class="header-actions">

		<!-- 알림 종 버튼 -->
		<button type="button" id="notificationBell" class="btn btn-sm"
			aria-label="알림 목록" aria-expanded="false">
			🔔 <span id="notificationCount" hidden>0</span>
		</button>

		<!-- 알림 목록 -->
		<div id="notificationPanel" hidden>

			<strong>알림 목록</strong>

			<ul id="notificationList">

				<li><strong>새로운 요청서 도착</strong>
					<div>고객님이 새로운 작업을 요청했습니다.</div></li>

				<li><strong>견적서 도착</strong>
					<div>고수님이 견적서를 보냈습니다.</div></li>

				<li><strong>새 채팅 메시지</strong>
					<div>새로운 채팅 메시지가 도착했습니다.</div></li>

			</ul>

		</div>

	</div>

	
<!-- 테스트 전용 가짜 알림 API -->
<script>
    const originalFetch = window.fetch;

    // 테스트용 알림 데이터
    const testNotifications = [
        {
            notificationId: 1,
            title: "새로운 요청서 도착",
            message: "고객님이 새로운 작업을 요청했습니다.",
            isRead: "N"
        },
        {
            notificationId: 2,
            title: "견적서 도착",
            message: "고수님이 견적서를 보냈습니다.",
            isRead: "N"
        },
        {
            notificationId: 3,
            title: "새 채팅 메시지",
            message: "새로운 채팅 메시지가 도착했습니다.",
            isRead: "Y"
        }
    ];

    window.fetch = function (url, options) {

        const requestUrl = String(url);
        const method = (options && options.method || "GET")
            .toUpperCase();

        // 알림 목록 조회
        if (method === "GET" &&
            requestUrl.endsWith("/notification/list")) {

            return Promise.resolve(
                new Response(JSON.stringify(testNotifications), {
                    status: 200,
                    headers: {
                        "Content-Type": "application/json"
                    }
                })
            );
        }

        // 알림 읽음 처리
        const readMatch = requestUrl.match(
            /\/notification\/(\d+)\/read$/
        );

        if (method === "POST" && readMatch) {

            const notificationId = Number(readMatch[1]);

            const notification = testNotifications.find(
                function (item) {
                    return item.notificationId === notificationId;
                }
            );

            if (!notification) {
                return Promise.resolve(
                    new Response(null, { status: 404 })
                );
            }

            notification.isRead = "Y";

            return Promise.resolve(
                new Response(null, { status: 204 })
            );
        }

        // 그 외 요청은 기존 fetch 사용
        return originalFetch.apply(window, arguments);
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<!-- 실제 알림 JavaScript -->
<script src="notification.js"></script>

<script>
    // 로그인 없이 WebSocket 연결 테스트
    if (typeof StompJs === "undefined") {
        console.error("STOMP 라이브러리를 불러오지 못했습니다.");
    } else {
        const wsTestClient = new StompJs.Client({
            brokerURL: "ws://" + location.host + "/app/ws",
            reconnectDelay: 0,


            onConnect: function () {
                console.log("WebSocket 테스트 연결 성공!");

                wsTestClient.subscribe(
                    "/user/queue/notifications",
                    function (message) {
                        console.log("실시간 알림 수신:", message.body);
                    }
                );

                console.log("알림 구독 요청 완료");
            },


            onWebSocketError: function (error) {
                console.error("WebSocket 연결 실패", error);
            },

            onStompError: function (frame) {
                console.error("STOMP 오류", frame);
            }
        });

        wsTestClient.activate();
    }
</script>

</body>
</html>
